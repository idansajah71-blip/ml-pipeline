# WAF Rules for ML Pipeline

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=prediction_limit:10m rate=5r/s;

# Block bad user agents
map $http_user_agent $bad_agent {
    default 0;
    ~*(?:scrapy|curl|wget|python-requests) 1;
    ~*(?:nikto|sqlmap|nessus|openvas) 1;
    ~*(?:havij|w3af|burpsuite) 1;
}

# Block bad referers
map $http_referer $bad_referer {
    default 0;
    ~*(?:spam|hack|crack) 1;
    ~*(?:exploit|attack|malware) 1;
}

# SQL Injection protection
map $request_uri $sql_injection {
    default 0;
    ~*(?:union.*select|select.*from|insert.*into|drop.*table) 1;
    ~*(?:delete.*from|update.*set|exec.*\() 1;
    ~*(?:\'\s*or\s*\'|\'\s*and\s*\') 1;
    ~*(?:;\s*drop|;\s*delete|;\s*insert) 1;
}

# XSS protection
map $request_uri $xss_attack {
    default 0;
    ~*(?:<script|javascript:|on\w+\s*=) 1;
    ~*(?:<iframe|<object|<embed|<applet) 1;
    ~*(?:eval\s*\(|document\.cookie|window\.location) 1;
}

# Path traversal protection
map $request_uri $path_traversal {
    default 0;
    ~*(?:\.\.\/|\.\.\\|%2e%2e%2f|%2e%2e\/) 1;
    ~*(?:\.\.%2f|\.\.%5c|%252e%252e) 1;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;

    # Block bad user agents
    if ($bad_agent) {
        return 403;
    }

    # Block bad referers
    if ($bad_referer) {
        return 403;
    }

    # Block SQL injection attempts
    if ($sql_injection) {
        return 403;
    }

    # Block XSS attempts
    if ($xss_attack) {
        return 403;
    }

    # Block path traversal attempts
    if ($path_traversal) {
        return 403;
    }

    # API rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # Block large request bodies
        client_max_body_size 100M;
        client_body_buffer_size 128k;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Login rate limiting
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prediction rate limiting
    location /api/v1/models/ {
        limit_req zone=prediction_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to sensitive files
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    # Block access to backup files
    location ~ \.(bak|old|orig|save)$ {
        deny all;
        return 404;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://backend:8000;
    }

    # Block common attack vectors
    location ~* (?:\.asp|\.aspx|\.jsp|\.cgi|\.pl|\.php)$ {
        return 404;
    }

    # Block XML bomb attacks
    location ~* \.xml$ {
        if ($request_uri ~* "DOCTYPE|ENTITY") {
            return 403;
        }
    }
}
