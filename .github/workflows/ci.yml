name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run lint
        run: ruff check app/

      - name: Run type check
        run: mypy app/ --ignore-missing-imports || true

      - name: Run CI quality gates
        run: python scripts/ci_quality_gates.py
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key
          API_KEY_PEPPER: test-pepper

      - name: Run unit tests
        run: pytest app/tests/test_ml_quality_gates.py app/tests/test_drift.py app/tests/test_retention_and_tasks.py -v --no-cov
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key
          API_KEY_PEPPER: test-pepper
