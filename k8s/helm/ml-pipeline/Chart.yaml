apiVersion: v2
name: ml-pipeline
description: ML Pipeline - FastAPI backend with Next.js dashboard
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - ml
  - machine-learning
  - pipeline
  - fastapi
  - scikit-learn

maintainers:
  - name: ML Pipeline Team
    email: team@mlpipeline.com

dependencies:
  - name: postgresql
    version: "13.2.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.6.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
