apiVersion: v1
kind: Service
metadata:
  name: {{ include "ml-pipeline.fullname" . }}-backend
  labels:
    {{- include "ml-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ml-pipeline.backend.selectorLabels" . | nindent 4 }}
