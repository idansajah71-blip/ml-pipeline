global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'locust'
    static_configs:
      - targets: ['locust-master:8089']
    scrape_interval: 5s
    metrics_path: '/metrics'

  - job_name: 'ml-pipeline'
    static_configs:
      - targets: ['host.docker.internal:8000']
    scrape_interval: 5s
    metrics_path: '/metrics'
